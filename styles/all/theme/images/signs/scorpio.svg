<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Scorpio">
<title>Scorpio</title>
<defs>
<radialGradient id="bg" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#2d3278"/><stop offset=".6" stop-color="#171b4a"/><stop offset="1" stop-color="#0b0d28"/></radialGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5b8cff" stop-opacity=".32"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#fff3c8"/><stop offset=".45" stop-color="#f2c75e"/><stop offset="1" stop-color="#c98f2e"/></linearGradient>
<filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
.orbit{transform-origin:100px 100px;animation:spin 36s linear infinite}
.orbit2{transform-origin:100px 100px;animation:spin 60s linear infinite reverse}
.glow{animation:breathe 4.8s ease-in-out infinite}
.st{fill:#fff;animation:tw 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.95}}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.orbit,.orbit2,.glow,.st{animation:none}.glow{opacity:.6}.st{opacity:.7}}
</style>
<circle cx="100" cy="100" r="97" fill="url(#bg)"/>
<circle cx="100" cy="100" r="80" fill="url(#halo)"/>
<g><circle class="st" cx="132.1" cy="39.3" r="1.6" style="animation-duration:3.1s;animation-delay:-1.9s"/><circle class="st" cx="76.2" cy="120.3" r="1.6" style="animation-duration:3.7s;animation-delay:-0.2s"/><circle class="st" cx="159.4" cy="67.9" r="1" style="animation-duration:3.8s;animation-delay:-2.1s"/><circle class="st" cx="102.3" cy="167.9" r="1" style="animation-duration:2.4s;animation-delay:-1.6s"/><circle class="st" cx="89.2" cy="78.1" r="1" style="animation-duration:3.9s;animation-delay:-0.8s"/><circle class="st" cx="82.2" cy="122.6" r="0.8" style="animation-duration:3.9s;animation-delay:-1.3s"/><circle class="st" cx="165.1" cy="110.2" r="1" style="animation-duration:2.8s;animation-delay:-0.3s"/><circle class="st" cx="38.0" cy="125.0" r="1.2" style="animation-duration:3.3s;animation-delay:-0.1s"/><circle class="st" cx="113.0" cy="160.7" r="1.6" style="animation-duration:2.5s;animation-delay:-0.7s"/><circle class="st" cx="134.4" cy="103.0" r="1" style="animation-duration:4.0s;animation-delay:-2.5s"/><circle class="st" cx="131.7" cy="80.0" r="1.2" style="animation-duration:3.1s;animation-delay:-1.6s"/><circle class="st" cx="121.3" cy="43.2" r="0.8" style="animation-duration:3.1s;animation-delay:-2.5s"/><circle class="st" cx="126.5" cy="106.1" r="0.8" style="animation-duration:3.6s;animation-delay:-1.0s"/><circle class="st" cx="88.5" cy="74.5" r="0.8" style="animation-duration:2.8s;animation-delay:-2.6s"/><circle class="st" cx="126.4" cy="59.6" r="0.8" style="animation-duration:2.7s;animation-delay:-0.7s"/><circle class="st" cx="48.5" cy="58.6" r="1.6" style="animation-duration:2.2s;animation-delay:-0.5s"/></g>
<circle cx="100" cy="100" r="95" fill="none" stroke="#5b8cff" stroke-width="3"/>
<g class="orbit"><circle cx="100" cy="100" r="87" fill="none" stroke="#a9c2ff" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="1.5 6.5" stroke-linecap="round"/><circle cx="100" cy="13" r="3.4" fill="#a9c2ff"/><circle cx="100" cy="13" r="7" fill="#5b8cff" opacity=".35"/></g>
<g class="orbit2"><circle cx="100" cy="100" r="79" fill="none" stroke="#f2c75e" stroke-opacity=".3" stroke-width="1" stroke-dasharray="18 10 2 10"/></g>
<g transform="translate(50 50)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<g class="glow" stroke="#5b8cff" stroke-width="11" filter="url(#blur)"><path d="M12 28 C18 22 24 26 24 34 V78"/><path d="M24 36 C24 24 38 24 38 36 V78"/><path d="M38 36 C38 24 52 24 52 36 V70 C52 78 58 81 66 77 L82 68"/><path d="M70 60 L82 68 L77 80"/></g>
<g stroke="url(#gold)" stroke-width="6.5"><path d="M12 28 C18 22 24 26 24 34 V78"/><path d="M24 36 C24 24 38 24 38 36 V78"/><path d="M38 36 C38 24 52 24 52 36 V70 C52 78 58 81 66 77 L82 68"/><path d="M70 60 L82 68 L77 80"/></g>
</g>
</svg>
