<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Gemini">
<title>Gemini</title>
<defs>
<radialGradient id="bg" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#2d3278"/><stop offset=".6" stop-color="#171b4a"/><stop offset="1" stop-color="#0b0d28"/></radialGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7cc4f2" stop-opacity=".32"/><stop offset="1" stop-color="#7cc4f2" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#fff3c8"/><stop offset=".45" stop-color="#f2c75e"/><stop offset="1" stop-color="#c98f2e"/></linearGradient>
<filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
.orbit{transform-origin:100px 100px;animation:spin 36s linear infinite}
.orbit2{transform-origin:100px 100px;animation:spin 60s linear infinite reverse}
.glow{animation:breathe 4.8s ease-in-out infinite}
.st{fill:#fff;animation:tw 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.95}}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.orbit,.orbit2,.glow,.st{animation:none}.glow{opacity:.6}.st{opacity:.7}}
</style>
<circle cx="100" cy="100" r="97" fill="url(#bg)"/>
<circle cx="100" cy="100" r="80" fill="url(#halo)"/>
<g><circle class="st" cx="32.2" cy="87.1" r="1.2" style="animation-duration:3.3s;animation-delay:-1.0s"/><circle class="st" cx="127.5" cy="166.7" r="0.8" style="animation-duration:3.4s;animation-delay:-2.4s"/><circle class="st" cx="78.1" cy="43.3" r="1.2" style="animation-duration:3.6s;animation-delay:-1.9s"/><circle class="st" cx="82.2" cy="144.1" r="1" style="animation-duration:2.2s;animation-delay:-0.2s"/><circle class="st" cx="70.5" cy="74.5" r="1" style="animation-duration:3.8s;animation-delay:-1.2s"/><circle class="st" cx="138.2" cy="105.9" r="1.6" style="animation-duration:4.1s;animation-delay:-0.7s"/><circle class="st" cx="73.2" cy="131.5" r="1.2" style="animation-duration:2.5s;animation-delay:-2.5s"/><circle class="st" cx="78.0" cy="36.8" r="1" style="animation-duration:2.7s;animation-delay:-2.0s"/><circle class="st" cx="98.6" cy="143.9" r="1.6" style="animation-duration:2.8s;animation-delay:-2.8s"/><circle class="st" cx="155.0" cy="138.2" r="0.8" style="animation-duration:3.0s;animation-delay:-2.8s"/><circle class="st" cx="54.5" cy="66.7" r="1.2" style="animation-duration:2.3s;animation-delay:-0.2s"/><circle class="st" cx="69.5" cy="37.5" r="1.2" style="animation-duration:3.0s;animation-delay:-2.8s"/><circle class="st" cx="168.2" cy="103.9" r="1.6" style="animation-duration:2.7s;animation-delay:-2.7s"/><circle class="st" cx="130.1" cy="92.3" r="0.8" style="animation-duration:3.6s;animation-delay:-2.2s"/><circle class="st" cx="128.5" cy="79.1" r="1" style="animation-duration:2.3s;animation-delay:-2.4s"/><circle class="st" cx="67.5" cy="119.8" r="1.2" style="animation-duration:3.7s;animation-delay:-0.9s"/></g>
<circle cx="100" cy="100" r="95" fill="none" stroke="#7cc4f2" stroke-width="3"/>
<g class="orbit"><circle cx="100" cy="100" r="87" fill="none" stroke="#c4e6fb" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="1.5 6.5" stroke-linecap="round"/><circle cx="100" cy="13" r="3.4" fill="#c4e6fb"/><circle cx="100" cy="13" r="7" fill="#7cc4f2" opacity=".35"/></g>
<g class="orbit2"><circle cx="100" cy="100" r="79" fill="none" stroke="#f2c75e" stroke-opacity=".3" stroke-width="1" stroke-dasharray="18 10 2 10"/></g>
<g transform="translate(50 50)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<g class="glow" stroke="#7cc4f2" stroke-width="11" filter="url(#blur)"><path d="M22 18 C38 27 62 27 78 18"/><path d="M22 84 C38 75 62 75 78 84"/><path d="M40 25 V77"/><path d="M60 25 V77"/></g>
<g stroke="url(#gold)" stroke-width="6.5"><path d="M22 18 C38 27 62 27 78 18"/><path d="M22 84 C38 75 62 75 78 84"/><path d="M40 25 V77"/><path d="M60 25 V77"/></g>
</g>
</svg>
