<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Virgo">
<title>Virgo</title>
<defs>
<radialGradient id="bg" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#2d3278"/><stop offset=".6" stop-color="#171b4a"/><stop offset="1" stop-color="#0b0d28"/></radialGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8cc063" stop-opacity=".32"/><stop offset="1" stop-color="#8cc063" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#fff3c8"/><stop offset=".45" stop-color="#f2c75e"/><stop offset="1" stop-color="#c98f2e"/></linearGradient>
<filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
.orbit{transform-origin:100px 100px;animation:spin 36s linear infinite}
.orbit2{transform-origin:100px 100px;animation:spin 60s linear infinite reverse}
.glow{animation:breathe 4.8s ease-in-out infinite}
.st{fill:#fff;animation:tw 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.95}}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.orbit,.orbit2,.glow,.st{animation:none}.glow{opacity:.6}.st{opacity:.7}}
</style>
<circle cx="100" cy="100" r="97" fill="url(#bg)"/>
<circle cx="100" cy="100" r="80" fill="url(#halo)"/>
<g><circle class="st" cx="114.8" cy="48.6" r="1.2" style="animation-duration:2.9s;animation-delay:-0.9s"/><circle class="st" cx="154.2" cy="97.0" r="1.2" style="animation-duration:3.8s;animation-delay:-2.2s"/><circle class="st" cx="79.3" cy="40.0" r="1.2" style="animation-duration:2.9s;animation-delay:-2.1s"/><circle class="st" cx="78.4" cy="158.6" r="0.8" style="animation-duration:3.8s;animation-delay:-1.0s"/><circle class="st" cx="112.1" cy="37.1" r="1.2" style="animation-duration:3.5s;animation-delay:-1.6s"/><circle class="st" cx="70.0" cy="64.2" r="1.6" style="animation-duration:3.9s;animation-delay:-2.5s"/><circle class="st" cx="170.2" cy="101.3" r="0.8" style="animation-duration:2.4s;animation-delay:-2.1s"/><circle class="st" cx="114.2" cy="80.1" r="0.8" style="animation-duration:3.7s;animation-delay:-2.5s"/><circle class="st" cx="49.2" cy="76.0" r="1.6" style="animation-duration:3.2s;animation-delay:-0.7s"/><circle class="st" cx="33.2" cy="106.6" r="1.6" style="animation-duration:2.5s;animation-delay:-1.7s"/><circle class="st" cx="105.8" cy="133.5" r="0.8" style="animation-duration:2.9s;animation-delay:-0.6s"/><circle class="st" cx="43.9" cy="131.7" r="1" style="animation-duration:3.0s;animation-delay:-0.9s"/><circle class="st" cx="89.5" cy="132.2" r="1.2" style="animation-duration:2.8s;animation-delay:-0.3s"/><circle class="st" cx="139.5" cy="51.0" r="1.2" style="animation-duration:2.4s;animation-delay:-2.7s"/><circle class="st" cx="82.2" cy="136.1" r="1.2" style="animation-duration:3.2s;animation-delay:-2.4s"/><circle class="st" cx="139.8" cy="129.4" r="1" style="animation-duration:2.5s;animation-delay:-0.2s"/></g>
<circle cx="100" cy="100" r="95" fill="none" stroke="#8cc063" stroke-width="3"/>
<g class="orbit"><circle cx="100" cy="100" r="87" fill="none" stroke="#c6e3a8" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="1.5 6.5" stroke-linecap="round"/><circle cx="100" cy="13" r="3.4" fill="#c6e3a8"/><circle cx="100" cy="13" r="7" fill="#8cc063" opacity=".35"/></g>
<g class="orbit2"><circle cx="100" cy="100" r="79" fill="none" stroke="#f2c75e" stroke-opacity=".3" stroke-width="1" stroke-dasharray="18 10 2 10"/></g>
<g transform="translate(50 50)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<g class="glow" stroke="#8cc063" stroke-width="11" filter="url(#blur)"><path d="M14 28 C20 22 26 26 26 34 V80"/><path d="M26 36 C26 24 40 24 40 36 V80"/><path d="M40 36 C40 24 54 24 54 36 V64 C54 80 68 84 76 72 C82 62 76 52 67 56 C58 60 58 78 71 88"/></g>
<g stroke="url(#gold)" stroke-width="6.5"><path d="M14 28 C20 22 26 26 26 34 V80"/><path d="M26 36 C26 24 40 24 40 36 V80"/><path d="M40 36 C40 24 54 24 54 36 V64 C54 80 68 84 76 72 C82 62 76 52 67 56 C58 60 58 78 71 88"/></g>
</g>
</svg>
