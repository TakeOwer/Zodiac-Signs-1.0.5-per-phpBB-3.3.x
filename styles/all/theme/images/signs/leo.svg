<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Leo">
<title>Leo</title>
<defs>
<radialGradient id="bg" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#2d3278"/><stop offset=".6" stop-color="#171b4a"/><stop offset="1" stop-color="#0b0d28"/></radialGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff7a45" stop-opacity=".32"/><stop offset="1" stop-color="#ff7a45" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#fff3c8"/><stop offset=".45" stop-color="#f2c75e"/><stop offset="1" stop-color="#c98f2e"/></linearGradient>
<filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
.orbit{transform-origin:100px 100px;animation:spin 36s linear infinite}
.orbit2{transform-origin:100px 100px;animation:spin 60s linear infinite reverse}
.glow{animation:breathe 4.8s ease-in-out infinite}
.st{fill:#fff;animation:tw 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.95}}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.orbit,.orbit2,.glow,.st{animation:none}.glow{opacity:.6}.st{opacity:.7}}
</style>
<circle cx="100" cy="100" r="97" fill="url(#bg)"/>
<circle cx="100" cy="100" r="80" fill="url(#halo)"/>
<g><circle class="st" cx="43.5" cy="137.3" r="0.8" style="animation-duration:2.7s;animation-delay:-0.8s"/><circle class="st" cx="51.0" cy="90.6" r="0.8" style="animation-duration:3.3s;animation-delay:-0.9s"/><circle class="st" cx="46.4" cy="125.3" r="1" style="animation-duration:2.5s;animation-delay:-1.9s"/><circle class="st" cx="78.7" cy="34.0" r="1" style="animation-duration:3.5s;animation-delay:-0.5s"/><circle class="st" cx="94.5" cy="66.1" r="1" style="animation-duration:3.1s;animation-delay:-2.8s"/><circle class="st" cx="127.7" cy="86.9" r="1.6" style="animation-duration:2.5s;animation-delay:-2.5s"/><circle class="st" cx="119.6" cy="118.6" r="1.2" style="animation-duration:3.0s;animation-delay:-2.5s"/><circle class="st" cx="79.9" cy="66.4" r="1" style="animation-duration:3.8s;animation-delay:-1.8s"/><circle class="st" cx="108.3" cy="134.1" r="1" style="animation-duration:3.6s;animation-delay:-1.5s"/><circle class="st" cx="116.5" cy="135.2" r="0.8" style="animation-duration:3.1s;animation-delay:-0.5s"/><circle class="st" cx="53.8" cy="96.5" r="1.2" style="animation-duration:3.3s;animation-delay:-1.7s"/><circle class="st" cx="123.7" cy="90.7" r="0.8" style="animation-duration:3.5s;animation-delay:-2.8s"/><circle class="st" cx="86.9" cy="75.9" r="0.8" style="animation-duration:2.4s;animation-delay:-3.0s"/><circle class="st" cx="53.8" cy="94.0" r="1.2" style="animation-duration:3.1s;animation-delay:-1.1s"/><circle class="st" cx="122.0" cy="57.1" r="1" style="animation-duration:4.1s;animation-delay:-2.5s"/><circle class="st" cx="106.9" cy="132.7" r="1" style="animation-duration:2.7s;animation-delay:-2.9s"/></g>
<circle cx="100" cy="100" r="95" fill="none" stroke="#ff7a45" stroke-width="3"/>
<g class="orbit"><circle cx="100" cy="100" r="87" fill="none" stroke="#ffb38a" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="1.5 6.5" stroke-linecap="round"/><circle cx="100" cy="13" r="3.4" fill="#ffb38a"/><circle cx="100" cy="13" r="7" fill="#ff7a45" opacity=".35"/></g>
<g class="orbit2"><circle cx="100" cy="100" r="79" fill="none" stroke="#f2c75e" stroke-opacity=".3" stroke-width="1" stroke-dasharray="18 10 2 10"/></g>
<g transform="translate(50 50)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<g class="glow" stroke="#ff7a45" stroke-width="11" filter="url(#blur)"><path d="M42 64 C42 44 40 22 57 18 C74 14 82 32 73 46 C64 58 62 76 71 82 C76 85 82 83 86 78"/><circle cx="29" cy="64" r="13"/></g>
<g stroke="url(#gold)" stroke-width="6.5"><path d="M42 64 C42 44 40 22 57 18 C74 14 82 32 73 46 C64 58 62 76 71 82 C76 85 82 83 86 78"/><circle cx="29" cy="64" r="13"/></g>
</g>
</svg>
