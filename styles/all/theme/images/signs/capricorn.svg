<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Capricorn">
<title>Capricorn</title>
<defs>
<radialGradient id="bg" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#2d3278"/><stop offset=".6" stop-color="#171b4a"/><stop offset="1" stop-color="#0b0d28"/></radialGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8cc063" stop-opacity=".32"/><stop offset="1" stop-color="#8cc063" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#fff3c8"/><stop offset=".45" stop-color="#f2c75e"/><stop offset="1" stop-color="#c98f2e"/></linearGradient>
<filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
.orbit{transform-origin:100px 100px;animation:spin 36s linear infinite}
.orbit2{transform-origin:100px 100px;animation:spin 60s linear infinite reverse}
.glow{animation:breathe 4.8s ease-in-out infinite}
.st{fill:#fff;animation:tw 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.95}}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.orbit,.orbit2,.glow,.st{animation:none}.glow{opacity:.6}.st{opacity:.7}}
</style>
<circle cx="100" cy="100" r="97" fill="url(#bg)"/>
<circle cx="100" cy="100" r="80" fill="url(#halo)"/>
<g><circle class="st" cx="97.1" cy="127.2" r="1" style="animation-duration:3.5s;animation-delay:-1.3s"/><circle class="st" cx="28.5" cy="93.1" r="1.6" style="animation-duration:3.4s;animation-delay:-0.7s"/><circle class="st" cx="81.6" cy="167.1" r="1.2" style="animation-duration:3.0s;animation-delay:-1.2s"/><circle class="st" cx="137.8" cy="146.4" r="1.2" style="animation-duration:3.9s;animation-delay:-0.8s"/><circle class="st" cx="63.7" cy="122.6" r="1.6" style="animation-duration:2.9s;animation-delay:-1.8s"/><circle class="st" cx="77.3" cy="91.9" r="0.8" style="animation-duration:3.4s;animation-delay:-1.4s"/><circle class="st" cx="85.1" cy="129.9" r="0.8" style="animation-duration:3.9s;animation-delay:-1.9s"/><circle class="st" cx="119.8" cy="125.4" r="1" style="animation-duration:3.2s;animation-delay:-3.0s"/><circle class="st" cx="53.7" cy="42.3" r="1" style="animation-duration:2.8s;animation-delay:-0.9s"/><circle class="st" cx="78.7" cy="53.4" r="1" style="animation-duration:4.0s;animation-delay:-0.1s"/><circle class="st" cx="123.0" cy="122.1" r="0.8" style="animation-duration:3.4s;animation-delay:-2.8s"/><circle class="st" cx="58.3" cy="123.5" r="1.2" style="animation-duration:3.7s;animation-delay:-1.6s"/><circle class="st" cx="64.8" cy="80.6" r="1.6" style="animation-duration:2.9s;animation-delay:-1.9s"/><circle class="st" cx="65.4" cy="99.6" r="1.2" style="animation-duration:3.5s;animation-delay:-2.1s"/><circle class="st" cx="55.3" cy="116.4" r="0.8" style="animation-duration:2.4s;animation-delay:-1.1s"/><circle class="st" cx="64.0" cy="57.0" r="1.6" style="animation-duration:3.0s;animation-delay:-0.7s"/></g>
<circle cx="100" cy="100" r="95" fill="none" stroke="#8cc063" stroke-width="3"/>
<g class="orbit"><circle cx="100" cy="100" r="87" fill="none" stroke="#c6e3a8" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="1.5 6.5" stroke-linecap="round"/><circle cx="100" cy="13" r="3.4" fill="#c6e3a8"/><circle cx="100" cy="13" r="7" fill="#8cc063" opacity=".35"/></g>
<g class="orbit2"><circle cx="100" cy="100" r="79" fill="none" stroke="#f2c75e" stroke-opacity=".3" stroke-width="1" stroke-dasharray="18 10 2 10"/></g>
<g transform="translate(50 50)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<g class="glow" stroke="#8cc063" stroke-width="11" filter="url(#blur)"><path d="M12 24 L27 72 L40 32 C45 21 56 24 56 37 V60 C56 76 69 83 79 74 C87 66 82 53 71 53 C60 53 58 68 63 77 C67 85 58 90 48 87"/></g>
<g stroke="url(#gold)" stroke-width="6.5"><path d="M12 24 L27 72 L40 32 C45 21 56 24 56 37 V60 C56 76 69 83 79 74 C87 66 82 53 71 53 C60 53 58 68 63 77 C67 85 58 90 48 87"/></g>
</g>
</svg>
