<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Pisces">
<title>Pisces</title>
<defs>
<radialGradient id="bg" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#2d3278"/><stop offset=".6" stop-color="#171b4a"/><stop offset="1" stop-color="#0b0d28"/></radialGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5b8cff" stop-opacity=".32"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#fff3c8"/><stop offset=".45" stop-color="#f2c75e"/><stop offset="1" stop-color="#c98f2e"/></linearGradient>
<filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
.orbit{transform-origin:100px 100px;animation:spin 36s linear infinite}
.orbit2{transform-origin:100px 100px;animation:spin 60s linear infinite reverse}
.glow{animation:breathe 4.8s ease-in-out infinite}
.st{fill:#fff;animation:tw 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.95}}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.orbit,.orbit2,.glow,.st{animation:none}.glow{opacity:.6}.st{opacity:.7}}
</style>
<circle cx="100" cy="100" r="97" fill="url(#bg)"/>
<circle cx="100" cy="100" r="80" fill="url(#halo)"/>
<g><circle class="st" cx="128.2" cy="146.6" r="1.2" style="animation-duration:2.6s;animation-delay:-2.2s"/><circle class="st" cx="127.2" cy="163.7" r="1.2" style="animation-duration:3.8s;animation-delay:-1.8s"/><circle class="st" cx="134.6" cy="59.7" r="1.6" style="animation-duration:4.1s;animation-delay:-2.3s"/><circle class="st" cx="162.5" cy="91.7" r="1" style="animation-duration:2.2s;animation-delay:-2.9s"/><circle class="st" cx="80.5" cy="33.0" r="0.8" style="animation-duration:4.0s;animation-delay:-1.9s"/><circle class="st" cx="81.1" cy="147.3" r="1.6" style="animation-duration:2.5s;animation-delay:-0.7s"/><circle class="st" cx="78.5" cy="81.1" r="1.2" style="animation-duration:2.7s;animation-delay:-0.5s"/><circle class="st" cx="157.6" cy="133.0" r="0.8" style="animation-duration:2.8s;animation-delay:-0.9s"/><circle class="st" cx="130.3" cy="110.1" r="0.8" style="animation-duration:2.4s;animation-delay:-1.1s"/><circle class="st" cx="90.5" cy="61.2" r="1.6" style="animation-duration:2.6s;animation-delay:-0.5s"/><circle class="st" cx="133.9" cy="118.1" r="1.2" style="animation-duration:2.7s;animation-delay:-1.1s"/><circle class="st" cx="85.3" cy="64.8" r="1.2" style="animation-duration:2.2s;animation-delay:-0.5s"/><circle class="st" cx="118.6" cy="143.9" r="1.2" style="animation-duration:3.9s;animation-delay:-2.3s"/><circle class="st" cx="138.5" cy="151.5" r="1" style="animation-duration:3.9s;animation-delay:-0.3s"/><circle class="st" cx="79.2" cy="124.2" r="1.2" style="animation-duration:3.1s;animation-delay:-0.5s"/><circle class="st" cx="151.7" cy="106.6" r="1" style="animation-duration:2.4s;animation-delay:-0.1s"/></g>
<circle cx="100" cy="100" r="95" fill="none" stroke="#5b8cff" stroke-width="3"/>
<g class="orbit"><circle cx="100" cy="100" r="87" fill="none" stroke="#a9c2ff" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="1.5 6.5" stroke-linecap="round"/><circle cx="100" cy="13" r="3.4" fill="#a9c2ff"/><circle cx="100" cy="13" r="7" fill="#5b8cff" opacity=".35"/></g>
<g class="orbit2"><circle cx="100" cy="100" r="79" fill="none" stroke="#f2c75e" stroke-opacity=".3" stroke-width="1" stroke-dasharray="18 10 2 10"/></g>
<g transform="translate(50 50)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<g class="glow" stroke="#5b8cff" stroke-width="11" filter="url(#blur)"><path d="M26 16 C45 33 45 67 26 84"/><path d="M74 16 C55 33 55 67 74 84"/><path d="M24 50 H76"/></g>
<g stroke="url(#gold)" stroke-width="6.5"><path d="M26 16 C45 33 45 67 26 84"/><path d="M74 16 C55 33 55 67 74 84"/><path d="M24 50 H76"/></g>
</g>
</svg>
