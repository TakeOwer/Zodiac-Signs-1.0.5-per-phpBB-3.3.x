<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Libra">
<title>Libra</title>
<defs>
<radialGradient id="bg" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#2d3278"/><stop offset=".6" stop-color="#171b4a"/><stop offset="1" stop-color="#0b0d28"/></radialGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7cc4f2" stop-opacity=".32"/><stop offset="1" stop-color="#7cc4f2" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#fff3c8"/><stop offset=".45" stop-color="#f2c75e"/><stop offset="1" stop-color="#c98f2e"/></linearGradient>
<filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
.orbit{transform-origin:100px 100px;animation:spin 36s linear infinite}
.orbit2{transform-origin:100px 100px;animation:spin 60s linear infinite reverse}
.glow{animation:breathe 4.8s ease-in-out infinite}
.st{fill:#fff;animation:tw 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.95}}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.orbit,.orbit2,.glow,.st{animation:none}.glow{opacity:.6}.st{opacity:.7}}
</style>
<circle cx="100" cy="100" r="97" fill="url(#bg)"/>
<circle cx="100" cy="100" r="80" fill="url(#halo)"/>
<g><circle class="st" cx="80.5" cy="119.5" r="1.6" style="animation-duration:4.1s;animation-delay:-2.5s"/><circle class="st" cx="61.8" cy="126.9" r="1.2" style="animation-duration:2.5s;animation-delay:-1.5s"/><circle class="st" cx="106.6" cy="35.6" r="1.6" style="animation-duration:2.2s;animation-delay:-0.3s"/><circle class="st" cx="152.8" cy="70.4" r="1.2" style="animation-duration:3.3s;animation-delay:-2.3s"/><circle class="st" cx="129.6" cy="147.9" r="1.6" style="animation-duration:2.8s;animation-delay:-2.6s"/><circle class="st" cx="114.9" cy="59.7" r="0.8" style="animation-duration:2.8s;animation-delay:-1.9s"/><circle class="st" cx="101.4" cy="150.7" r="1.6" style="animation-duration:3.5s;animation-delay:-1.0s"/><circle class="st" cx="78.8" cy="41.5" r="1" style="animation-duration:3.5s;animation-delay:-0.4s"/><circle class="st" cx="77.8" cy="45.1" r="1.6" style="animation-duration:2.5s;animation-delay:-0.3s"/><circle class="st" cx="136.2" cy="120.2" r="1" style="animation-duration:3.8s;animation-delay:-1.7s"/><circle class="st" cx="75.2" cy="162.7" r="1" style="animation-duration:3.9s;animation-delay:-0.3s"/><circle class="st" cx="61.6" cy="93.2" r="1.2" style="animation-duration:3.6s;animation-delay:-0.5s"/><circle class="st" cx="156.2" cy="111.3" r="1.2" style="animation-duration:2.6s;animation-delay:-2.3s"/><circle class="st" cx="97.2" cy="130.5" r="0.8" style="animation-duration:3.8s;animation-delay:-0.9s"/><circle class="st" cx="62.0" cy="86.3" r="1.6" style="animation-duration:2.5s;animation-delay:-2.4s"/><circle class="st" cx="132.7" cy="80.6" r="1" style="animation-duration:3.3s;animation-delay:-0.5s"/></g>
<circle cx="100" cy="100" r="95" fill="none" stroke="#7cc4f2" stroke-width="3"/>
<g class="orbit"><circle cx="100" cy="100" r="87" fill="none" stroke="#c4e6fb" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="1.5 6.5" stroke-linecap="round"/><circle cx="100" cy="13" r="3.4" fill="#c4e6fb"/><circle cx="100" cy="13" r="7" fill="#7cc4f2" opacity=".35"/></g>
<g class="orbit2"><circle cx="100" cy="100" r="79" fill="none" stroke="#f2c75e" stroke-opacity=".3" stroke-width="1" stroke-dasharray="18 10 2 10"/></g>
<g transform="translate(50 50)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<g class="glow" stroke="#7cc4f2" stroke-width="11" filter="url(#blur)"><path d="M16 80 H84"/><path d="M16 64 H35 C26 57 26 34 50 32 C74 34 74 57 65 64 H84"/></g>
<g stroke="url(#gold)" stroke-width="6.5"><path d="M16 80 H84"/><path d="M16 64 H35 C26 57 26 34 50 32 C74 34 74 57 65 64 H84"/></g>
</g>
</svg>
