<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cancer">
<title>Cancer</title>
<defs>
<radialGradient id="bg" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#2d3278"/><stop offset=".6" stop-color="#171b4a"/><stop offset="1" stop-color="#0b0d28"/></radialGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5b8cff" stop-opacity=".32"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#fff3c8"/><stop offset=".45" stop-color="#f2c75e"/><stop offset="1" stop-color="#c98f2e"/></linearGradient>
<filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
.orbit{transform-origin:100px 100px;animation:spin 36s linear infinite}
.orbit2{transform-origin:100px 100px;animation:spin 60s linear infinite reverse}
.glow{animation:breathe 4.8s ease-in-out infinite}
.st{fill:#fff;animation:tw 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.95}}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.orbit,.orbit2,.glow,.st{animation:none}.glow{opacity:.6}.st{opacity:.7}}
</style>
<circle cx="100" cy="100" r="97" fill="url(#bg)"/>
<circle cx="100" cy="100" r="80" fill="url(#halo)"/>
<g><circle class="st" cx="158.9" cy="106.7" r="1.2" style="animation-duration:4.2s;animation-delay:-2.5s"/><circle class="st" cx="80.4" cy="137.6" r="1" style="animation-duration:3.5s;animation-delay:-0.3s"/><circle class="st" cx="139.4" cy="113.6" r="1" style="animation-duration:3.9s;animation-delay:-3.0s"/><circle class="st" cx="124.7" cy="61.0" r="1" style="animation-duration:4.0s;animation-delay:-0.8s"/><circle class="st" cx="122.1" cy="37.4" r="1.6" style="animation-duration:2.7s;animation-delay:-2.3s"/><circle class="st" cx="97.9" cy="148.6" r="1.6" style="animation-duration:2.6s;animation-delay:-1.5s"/><circle class="st" cx="67.5" cy="89.7" r="1.2" style="animation-duration:3.9s;animation-delay:-1.8s"/><circle class="st" cx="67.7" cy="149.2" r="1.6" style="animation-duration:3.1s;animation-delay:-2.5s"/><circle class="st" cx="61.2" cy="84.4" r="1.2" style="animation-duration:4.1s;animation-delay:-1.5s"/><circle class="st" cx="106.2" cy="162.8" r="1.6" style="animation-duration:3.4s;animation-delay:-0.6s"/><circle class="st" cx="92.4" cy="151.0" r="1" style="animation-duration:2.9s;animation-delay:-0.2s"/><circle class="st" cx="118.3" cy="61.8" r="1.2" style="animation-duration:2.7s;animation-delay:-2.8s"/><circle class="st" cx="103.5" cy="164.3" r="0.8" style="animation-duration:2.2s;animation-delay:-0.7s"/><circle class="st" cx="97.8" cy="160.5" r="0.8" style="animation-duration:3.7s;animation-delay:-2.0s"/><circle class="st" cx="86.0" cy="42.0" r="1.2" style="animation-duration:4.1s;animation-delay:-1.9s"/><circle class="st" cx="124.3" cy="133.3" r="1" style="animation-duration:3.1s;animation-delay:-1.4s"/></g>
<circle cx="100" cy="100" r="95" fill="none" stroke="#5b8cff" stroke-width="3"/>
<g class="orbit"><circle cx="100" cy="100" r="87" fill="none" stroke="#a9c2ff" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="1.5 6.5" stroke-linecap="round"/><circle cx="100" cy="13" r="3.4" fill="#a9c2ff"/><circle cx="100" cy="13" r="7" fill="#5b8cff" opacity=".35"/></g>
<g class="orbit2"><circle cx="100" cy="100" r="79" fill="none" stroke="#f2c75e" stroke-opacity=".3" stroke-width="1" stroke-dasharray="18 10 2 10"/></g>
<g transform="translate(50 50)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<g class="glow" stroke="#5b8cff" stroke-width="11" filter="url(#blur)"><path d="M28 29 C44 17 70 19 86 32"/><path d="M72 73 C56 85 30 83 14 70"/><circle cx="28" cy="40" r="11"/><circle cx="72" cy="62" r="11"/></g>
<g stroke="url(#gold)" stroke-width="6.5"><path d="M28 29 C44 17 70 19 86 32"/><path d="M72 73 C56 85 30 83 14 70"/><circle cx="28" cy="40" r="11"/><circle cx="72" cy="62" r="11"/></g>
</g>
</svg>
